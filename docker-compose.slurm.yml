services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
    ports:
      - "8080:8080"
    volumes:
      - ./slurm/keycloak/yaptide-realm.json:/opt/keycloak/data/import/yaptide-realm.json:ro

  certificate-authority:
    build:
      context: ./slurm
      dockerfile: Dockerfile.certificate-authority
    container_name: certificate-authority
    hostname: certificate-authority
    ports:
      - "5001:5001"
    volumes:
      - ./slurm/ca_key:/ca_key:ro
    environment:
      - CA_KEY_PATH=/ca_key/ca_key
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('localhost', 5001), timeout=2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 3

  mysql:
    image: mariadb:12
    hostname: mysql
    container_name: mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-slurm_acct_db}
      MYSQL_USER: ${MYSQL_USER:-slurm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - var_lib_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  slurmdbd:
    image: slurm-docker-cluster:${SLURM_VERSION:-25.11.4}
    build:
      context: ./slurm
      args:
        SLURM_VERSION: ${SLURM_VERSION:-25.11.4}
        LMOD_VERSION: ${LMOD_VERSION:-9.1.2}
        SPACK_VERSION: ${SPACK_VERSION:-v1.1.1}
        BUILDER_BASE: ${BUILDER_BASE:-rockylinux/rockylinux:9}
        RUNTIME_BASE: ${RUNTIME_BASE:-rockylinux/rockylinux:9}
      cache_from:
        - slurm-docker-cluster:${SLURM_VERSION:-25.11.4}
    init: true
    command: ["slurmdbd"]
    container_name: slurmdbd
    hostname: slurmdbd
    environment:
      MYSQL_USER: ${MYSQL_USER:-slurm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
    expose:
      - "6819"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof slurmdbd"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  slurmctld:
    image: slurm-docker-cluster:25.11.4
    init: true
    command: ["slurmctld"]
    container_name: slurmctld
    hostname: slurmctld
    privileged: true
    working_dir: /data
    environment:
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-}
      SSH_ENABLE: ${SSH_ENABLE:-true}
      SLURM_USER: ${SLURM_USER:-devuser}
      SLURM_ACCOUNT: ${SLURM_ACCOUNT:-dev_account}
    volumes:
      - etc_munge:/etc/munge:z
      - etc_slurm:/etc/slurm:z
      - slurm_jobdir:/data:z
      - var_log_slurm:/var/log/slurm:z
      - opt_modulefiles:/opt/modulefiles
      - spack_root:/opt/spack
      - ./slurm/ca_key/ca_key.pub:/tmp/ca.pub:ro
      - ./bin:/opt/spack/modules/shieldhit/bin:ro
      - tmp_scratch:/tmp/scratch:z
    ports:
      - "${SSH_PORT:-3022}:22"
    expose:
      - "6817"
    depends_on:
      slurmdbd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "scontrol ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  slurmrestd:
    image: slurm-docker-cluster:${SLURM_VERSION:-25.11.4}
    init: true
    command: ["slurmrestd"]
    container_name: slurmrestd
    hostname: slurmrestd
    privileged: true
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
    ports:
      - "6820:6820"
    expose:
      - "6820"
    depends_on:
      slurmctld:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/slurmrestd/slurmrestd.socket"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  cpu-worker:
    image: slurm-docker-cluster:${SLURM_VERSION:-25.11.4}
    init: true
    command: ["slurmd-cpu"]
    working_dir: /data
    privileged: true
    environment:
      SLURM_USER: ${SLURM_USER:-devuser}
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
      - opt_modulefiles:/opt/modulefiles
      - spack_root:/opt/spack
      - ./bin:/opt/spack/modules/shieldhit/bin:ro
      - tmp_scratch:/tmp/scratch:z
    expose:
      - "6818"
    depends_on:
      slurmctld:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof slurmd"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: ${CPU_WORKER_COUNT:-2}

volumes:
  etc_munge:
  etc_slurm:
  slurm_jobdir:
  var_lib_mysql:
  var_log_slurm:
  opt_modulefiles:
  spack_root:
  tmp_scratch:
