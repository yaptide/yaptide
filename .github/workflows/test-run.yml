name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  get-simulators:
    env:
      POETRY_VIRTUALENVS_CREATE: false
    runs-on:  ${{ matrix.platform }}
    strategy:
      matrix:
        platform: ['ubuntu-latest', 'windows-latest']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Update pip and install poetry
        run: |
          python3 -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies for production
        run: |
          poetry install --only main

      # download full version of SHIELD-HIT12A from S3 (no demo/website fallback - see #1658)
      # retried up to 3 times since the S3 endpoint occasionally stalls on GitHub-hosted runners
      - name: Get simulators for Linux
        if: matrix.platform == 'ubuntu-latest'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: poetry run python yaptide/admin/simulators.py download-shieldhit --decrypt --dir bin/
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENCRYPTION_PASSWORD: ${{ secrets.S3_ENCRYPTION_PASSWORD }}
          S3_ENCRYPTION_SALT: ${{ secrets.S3_ENCRYPTION_SALT }}
          S3_SHIELDHIT_BUCKET: ${{ vars.S3_LINUX_SHIELDHIT_BUCKET }}
          S3_SHIELDHIT_KEY: ${{ vars.S3_LINUX_SHIELDHIT_KEY }}

      # Windows S3 object is an unencrypted demo shieldhit.exe, not the encrypted full version - no --decrypt
      # retried up to 3 times since the S3 endpoint occasionally stalls on GitHub-hosted runners
      - name: Get simulators for Windows
        if: matrix.platform == 'windows-latest'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: poetry run python yaptide/admin/simulators.py download-shieldhit --dir bin/
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_SHIELDHIT_BUCKET: ${{ vars.S3_WINDOWS_SHIELDHIT_BUCKET }}
          S3_SHIELDHIT_KEY: ${{ vars.S3_WINDOWS_SHIELDHIT_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: simulators-${{ matrix.platform }}
          path: bin/
          if-no-files-found: error
          retention-days: 1

  build-and-test:
    runs-on:  ${{ matrix.platform }}
    needs: get-simulators
    env:
      POETRY_VIRTUALENVS_CREATE: false
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        platform: ['ubuntu-latest']
        include:
          - python-version: '3.12'
            platform: 'windows-latest'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download simulators
        uses: actions/download-artifact@v8
        with:
          name: simulators-${{ matrix.platform }}
          path: bin/

      - name: Update pip and install poetry
        run: |
          python3 -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies for production
        run: poetry install --only main

      - name: Install dependencies for tests
        run: poetry install --only test

      - name: Run main tests on Linux
        if: matrix.platform == 'ubuntu-latest'
        run: |
          chmod +x bin/shieldhit
          poetry run pytest --reruns 3 --reruns-delay 5

      - name: Run main tests on Windows
        if: matrix.platform == 'windows-latest'
        run: poetry run pytest --reruns 3 --reruns-delay 5 -k "not test_run_simulation_with_flask and not test_run_simulation_with_flask_crashing"


  # upload coverage report to deepsource
  report-test-converage-deepsource:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies for production and test
        run: |
          python3 -m pip install --upgrade pip
          pip install poetry
          poetry install --only main,test

      - name: Install deepsource CLI
        run: curl https://deepsource.io/cli | sh

      - name: Download simulators
        uses: actions/download-artifact@v8
        with:
          name: simulators-ubuntu-latest
          path: bin/

      - name: Generate tests coverage report
        run: |
          chmod +x bin/shieldhit
          poetry run pytest --cov=./ --cov-report xml

      - name: Upload coverage report to deepsource
        run: ./bin/deepsource report --analyzer test-coverage --key python --value-file ./coverage.xml
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
