# main proxy server listening on port 5000 for plain HTTP and 8443 for HTTPS
server {

    listen 5000;
    listen 8443 ssl;

    ssl_certificate /etc/nginx/conf.d/server.crt;
    ssl_certificate_key /etc/nginx/conf.d/server.key;

    # backends are looked up per request (Docker's DNS): a restarted container may come back with another address,
    # which a name resolved once at start would miss until nginx is reloaded (502s meanwhile)
    resolver 127.0.0.11 valid=10s;

    # result pages in object storage (docker-compose.yml, service garage), read by the browser with signed links
    # that /results hands out; Host and the path are passed unchanged, as the signature covers them
    location /yaptide-results/ {
        set $garage http://garage:3900;
        proxy_pass $garage;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # a browser's preflight (a page fetched with a header that needs one) gets its answer here
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range,If-None-Match,If-Modified-Since' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }
        # reads only: the backend writes the pages straight to the storage, inside the compose network (not
        # limit_except, which would refuse the preflight before the answer above)
        if ($request_method !~ ^(GET|HEAD)$) {
            return 403;
        }
        # the storage sends its own "*" on errors, two values would make the browser hide the real status
        proxy_hide_header Access-Control-Allow-Origin;
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Encoding' always;
    }

    # set CORS policy for all requests including preflighted ones (credentials are allowed by default)
    location / {
        # Flask, listening on port 6000 of yaptide_flask
        set $flask http://yaptide_flask:6000;
        proxy_pass $flask;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, OPTIONS, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        client_max_body_size 100M;
    }

}
