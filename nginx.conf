# main proxy server listening on port 5000 for plain HTTP and 8443 for HTTPS
server {

    listen 5000;
    listen 8443 ssl;

    ssl_certificate /etc/nginx/conf.d/server.crt;
    ssl_certificate_key /etc/nginx/conf.d/server.key;

    # Flask is looked up per request (Docker's DNS): a restarted container may come back with another address,
    # which a name resolved once at start would miss until nginx is reloaded (502s meanwhile)
    resolver 127.0.0.11 valid=10s;

    # set CORS policy for all requests including preflighted ones (credentials are allowed by default)
    location / {
        # Flask, listening on port 6000 of yaptide_flask
        set $flask http://yaptide_flask:6000;
        proxy_pass $flask;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, OPTIONS, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        client_max_body_size 100M;
    }

}
