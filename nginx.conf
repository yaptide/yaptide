# Flask backend is listening on port 6000 on host called yaptide_flask
upstream backend_flask {
    server yaptide_flask:6000;
}

# main proxy server listening on port 5000 for plain HTTP and 8443 for HTTPS
server {

    listen 5000;
    listen 8443 ssl;

    ssl_certificate /etc/nginx/conf.d/server.crt;
    ssl_certificate_key /etc/nginx/conf.d/server.key;

    # result pages in object storage (docker-compose.yml, service garage), read by the browser with signed links;
    # Host and the path are passed unchanged, as the signature covers them
    location /yaptide-results/ {
        # resolved per request, so nginx starts also on deployments without the storage
        resolver 127.0.0.11 valid=30s;
        set $garage http://garage:3900;
        proxy_pass $garage;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # reads only: nginx would otherwise buffer any anonymous upload to disk before the storage refuses it
        limit_except GET { deny all; }
        # the storage sends its own "*" on errors, two values would make the browser hide the real status
        proxy_hide_header Access-Control-Allow-Origin;
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Encoding' always;
    }

    # set CORS policy for all requests including preflighted ones (credentials are allowed by default)
    location / {
        proxy_pass http://backend_flask; # pass requests for dynamic content to Flask app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, OPTIONS, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        client_max_body_size 100M;
    }

}
