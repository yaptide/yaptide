# this docker compose should be compatible also with older (<=v24) version of docker engine

services:
  # result pages; started only with COMPOSE_PROFILES=storage and the keys below set in .env
  # (RESULTS_S3_ACCESS_KEY "GK" + 32 hex, RESULTS_S3_SECRET_KEY and GARAGE_RPC_SECRET 64 hex); the key pair is fixed
  # after the first start - a new secret for the same key id stops Garage from starting
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: yaptide_garage
    restart: unless-stopped
    profiles: ["storage"]
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:-}
      - GARAGE_DEFAULT_ACCESS_KEY=${RESULTS_S3_ACCESS_KEY:-}
      - GARAGE_DEFAULT_SECRET_KEY=${RESULTS_S3_SECRET_KEY:-}
      - GARAGE_DEFAULT_BUCKET=yaptide-results
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    # no ports are published: the browser reaches the bucket only through nginx, with signed links

  postgresql:
    image: postgres:16-alpine
    container_name: yaptide_postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yaptide_db}
      POSTGRES_USER: ${POSTGRES_USER:-yaptide_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yaptide_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h $${POSTGRES_HOST:-postgresql} -p $${POSTGRES_PORT:-5432} -U $${POSTGRES_USER:-yaptide_user}"]

  yaptide_flask:
    build:
      context: .
      dockerfile: Dockerfile-flask
    image: yaptide_flask
    container_name: yaptide_flask
    restart: unless-stopped
    # longer than gunicorn's 30 s graceful timeout, so a redeploy lets requests up to 30 s long finish
    stop_grace_period: 40s
    environment:
      - CERT_AUTH_URL=${CERT_AUTH_URL:-}
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL:-}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-}
      - BACKEND_EXTERNAL_URL=${BACKEND_EXTERNAL_URL:-}
      # set both in production, otherwise every restart invalidates the update keys of running HPC jobs
      - YAPTIDE_TOKEN_SECRET=${YAPTIDE_TOKEN_SECRET:-}
      - YAPTIDE_REFRESH_TOKEN_SECRET=${YAPTIDE_REFRESH_TOKEN_SECRET:-}
      # empty means sized to the machine, see gunicorn.conf.py
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-}
      # Local (username/password) users are disabled unless explicitly enabled, so that
      # Keycloak-authenticated deployments (yap-dev, yaptide) do not expose /auth/register and /auth/login.
      - ENABLE_LOCAL_USERS=${ENABLE_LOCAL_USERS:-false}
      - FLASK_SQLALCHEMY_DATABASE_URI=postgresql+psycopg://${POSTGRES_USER:-yaptide_user}:${POSTGRES_PASSWORD:-yaptide_password}@postgresql:5432/${POSTGRES_DB:-yaptide_db}
      # result pages go to the garage service when its keys are set; links point to BACKEND_EXTERNAL_URL
      - RESULTS_S3_BUCKET=${RESULTS_S3_ACCESS_KEY:+yaptide-results}
      - RESULTS_S3_ENDPOINT=http://garage:3900
      - RESULTS_S3_ACCESS_KEY=${RESULTS_S3_ACCESS_KEY:-}
      - RESULTS_S3_SECRET_KEY=${RESULTS_S3_SECRET_KEY:-}
      # true: pages stored as Zarr go to the UI as JSON, for a UI that does not read Zarr yet
      - RESULTS_SERVE_JSON=${RESULTS_SERVE_JSON:-false}
    depends_on:
      postgresql:
        condition: service_healthy

  # streams of simulation status for the UI (yaptide/routes/events_routes.py): each open stream holds a thread, so
  # they get their own threaded server instead of the sync workers above; nginx sends /events/ here
  yaptide_events:
    image: yaptide_flask
    container_name: yaptide_events
    restart: unless-stopped
    entrypoint:
      - gunicorn
      - --worker-class=gthread
      - --workers=1
      - --threads=200
      - --bind=0.0.0.0:6001
      - yaptide.application:create_app()
    # the image's own check asks port 6000, where yaptide_flask listens
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; exit(0) if requests.get('http://localhost:6001/').ok else exit(1)"]
    environment:
      # the tokens of yaptide_flask are checked here: without both secrets set, each server draws its own and
      # every stream is refused
      - YAPTIDE_TOKEN_SECRET=${YAPTIDE_TOKEN_SECRET:-}
      - YAPTIDE_REFRESH_TOKEN_SECRET=${YAPTIDE_REFRESH_TOKEN_SECRET:-}
      - ENABLE_LOCAL_USERS=${ENABLE_LOCAL_USERS:-false}
      - FLASK_SQLALCHEMY_DATABASE_URI=postgresql+psycopg://${POSTGRES_USER:-yaptide_user}:${POSTGRES_PASSWORD:-yaptide_password}@postgresql:5432/${POSTGRES_DB:-yaptide_db}
    depends_on:
      # Flask prepares the database schema before it reports healthy
      yaptide_flask:
        condition: service_healthy

  yaptide_simulation_worker:
    build:
      context: .
      dockerfile: Dockerfile-simulation-worker
    image: yaptide_simulation_worker
    container_name: yaptide_simulation_worker
    restart: unless-stopped
    # the engine runs as the main process, an init reaps the Ray processes it does not wait for
    init: true
    volumes:
      - simulators:/simulators:rw
    # Ray's object store lives in /dev/shm; it carries only the simulation input, the results stay on disk
    shm_size: 1gb
    deploy:
      resources:
        limits:
          # the explanation of below syntax: https://www.gnu.org/software/bash/manual/html_node/Shell-Parameter-Expansion.html
          cpus: ${MAX_CORES-1.0}
    env_file: .env
    environment:
      - LOG_LEVEL_ROOT=${LOG_LEVEL_ROOT:-INFO}
      # HPC jobs report to the backend's public address with update keys the engine signs - with Flask's secret
      - BACKEND_EXTERNAL_URL=${BACKEND_EXTERNAL_URL:-}
      - YAPTIDE_TOKEN_SECRET=${YAPTIDE_TOKEN_SECRET:-}
      # the engine reads and writes simulations in the same database as Flask
      - FLASK_SQLALCHEMY_DATABASE_URI=postgresql+psycopg://${POSTGRES_USER:-yaptide_user}:${POSTGRES_PASSWORD:-yaptide_password}@postgresql:5432/${POSTGRES_DB:-yaptide_db}
      # simulation tasks run at once; empty means one per core of the machine
      - RAY_NUM_CPUS=${RAY_NUM_CPUS:-}
      # a RAY_AUTH_TOKEN in .env (env_file) is used when set; an empty one here would hide the generated token
      - RAY_AUTH_MODE=token
      - PYTHONPATH=/usr/local/app
      # the same storage as yaptide_flask, for the engine writing results itself (keys come from .env)
      - RESULTS_S3_BUCKET=${RESULTS_S3_ACCESS_KEY:+yaptide-results}
      - RESULTS_S3_ENDPOINT=http://garage:3900
    # no ports are published: nothing outside this container talks to Ray
    healthcheck:
      # GCS answering is not enough: without the raylet no task can run, while the container keeps running
      test: ["CMD-SHELL", "ray health-check --address localhost:6379 && grep -qx raylet /proc/[0-9]*/comm"]
    depends_on:
      # Flask prepares the database schema before it reports healthy
      yaptide_flask:
        condition: service_healthy

  nginx:
    image: yaptide_nginx
    container_name: yaptide_nginx
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile-nginx
    ports:
      - 5000:5000
      - 8443:8443
    # the TLS certificate and key, from the host: a renewal replaces the files and reloads nginx
    # (scripts/update_certs.sh), a rebuilt image keeps them; without them nginx uses a self-signed pair
    # (scripts/nginx_tls.sh)
    volumes:
      - ${TLS_CERT_PATH:-./server.crt}:/etc/nginx/certs/server.crt:ro
      - ${TLS_KEY_PATH:-./server.key}:/etc/nginx/certs/server.key:ro
    depends_on:
      yaptide_flask:
        condition: service_healthy
      yaptide_simulation_worker:
        condition: service_healthy
      yaptide_events:
        condition: service_started


volumes:
  data:
  simulators:
  garage_meta:
  garage_data:
