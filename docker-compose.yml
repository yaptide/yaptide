# this docker compose should be compatible also with older (<=v24) version of docker engine

services:
  redis:
    image: redis:8-alpine
    container_name: yaptide_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  # result pages; started only with COMPOSE_PROFILES=storage and the keys below set in .env
  # (RESULTS_S3_ACCESS_KEY "GK" + 32 hex, RESULTS_S3_SECRET_KEY and GARAGE_RPC_SECRET 64 hex); the key pair is fixed
  # after the first start - a new secret for the same key id stops Garage from starting
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: yaptide_garage
    restart: unless-stopped
    profiles: ["storage"]
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:-}
      - GARAGE_DEFAULT_ACCESS_KEY=${RESULTS_S3_ACCESS_KEY:-}
      - GARAGE_DEFAULT_SECRET_KEY=${RESULTS_S3_SECRET_KEY:-}
      - GARAGE_DEFAULT_BUCKET=yaptide-results
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    # no ports are published: the browser reaches the bucket only through nginx, with signed links

  postgresql:
    image: postgres:16-alpine
    container_name: yaptide_postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yaptide_db}
      POSTGRES_USER: ${POSTGRES_USER:-yaptide_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yaptide_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h $${POSTGRES_HOST:-postgresql} -p $${POSTGRES_PORT:-5432} -U $${POSTGRES_USER:-yaptide_user}"]

  yaptide_flask:
    build:
      context: .
      dockerfile: Dockerfile-flask
    image: yaptide_flask
    container_name: yaptide_flask
    restart: unless-stopped
    # longer than gunicorn's 30 s graceful timeout, so a redeploy lets requests up to 30 s long finish
    stop_grace_period: 40s
    environment:
      - CELERY_BROKER_URL=redis://yaptide_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://yaptide_redis:6379/0
      - CERT_AUTH_URL=${CERT_AUTH_URL:-}
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL:-}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-}
      - BACKEND_EXTERNAL_URL=${BACKEND_EXTERNAL_URL:-}
      # set both in production, otherwise every restart invalidates the update keys of running HPC jobs
      - YAPTIDE_TOKEN_SECRET=${YAPTIDE_TOKEN_SECRET:-}
      - YAPTIDE_REFRESH_TOKEN_SECRET=${YAPTIDE_REFRESH_TOKEN_SECRET:-}
      # empty means sized to the machine, see gunicorn.conf.py
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-}
      # Local (username/password) users are disabled unless explicitly enabled, so that
      # Keycloak-authenticated deployments (yap-dev, yaptide) do not expose /auth/register and /auth/login.
      - ENABLE_LOCAL_USERS=${ENABLE_LOCAL_USERS:-false}
      - FLASK_SQLALCHEMY_DATABASE_URI=postgresql+psycopg://${POSTGRES_USER:-yaptide_user}:${POSTGRES_PASSWORD:-yaptide_password}@postgresql:5432/${POSTGRES_DB:-yaptide_db}
      # result pages go to the garage service when its keys are set; links point to BACKEND_EXTERNAL_URL
      - RESULTS_S3_BUCKET=${RESULTS_S3_ACCESS_KEY:+yaptide-results}
      - RESULTS_S3_ENDPOINT=http://garage:3900
      - RESULTS_S3_ACCESS_KEY=${RESULTS_S3_ACCESS_KEY:-}
      - RESULTS_S3_SECRET_KEY=${RESULTS_S3_SECRET_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy

  yaptide_simulation_worker:
    build:
      context: .
      dockerfile: Dockerfile-simulation-worker
    image: yaptide_simulation_worker
    container_name: yaptide_simulation_worker
    restart: unless-stopped
    volumes:
      - simulators:/simulators:rw
    deploy:
      resources:
        limits:
          # the explanation of below syntax: https://www.gnu.org/software/bash/manual/html_node/Shell-Parameter-Expansion.html
          cpus: ${MAX_CORES-1.0}
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://yaptide_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://yaptide_redis:6379/0
      - BACKEND_INTERNAL_URL=http://yaptide_flask:6000
      - LOG_LEVEL_ROOT=${LOG_LEVEL_ROOT:-WARNING}
    healthcheck:
      test: ["CMD-SHELL", "celery --app yaptide.celery.simulation_worker inspect ping"]
    depends_on:
      redis:
        condition: service_healthy
      yaptide_flask:
        condition: service_healthy

  yaptide_helper_worker:
    build:
      context: .
      dockerfile: Dockerfile-helper-worker
    image: yaptide_helper_worker
    container_name: yaptide_helper_worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://yaptide_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://yaptide_redis:6379/0
      - LOG_LEVEL_ROOT=${LOG_LEVEL_ROOT:-WARNING}
      - BACKEND_INTERNAL_URL=http://yaptide_flask:6000
      - FLASK_SQLALCHEMY_DATABASE_URI=postgresql+psycopg://${POSTGRES_USER:-yaptide_user}:${POSTGRES_PASSWORD:-yaptide_password}@postgresql:5432/${POSTGRES_DB:-yaptide_db}
    healthcheck:
      test: ["CMD-SHELL", "celery --app yaptide.utils.helper_worker inspect ping"]
    depends_on:
      redis:
        condition: service_healthy
      yaptide_flask:
        condition: service_healthy

  nginx:
    image: yaptide_nginx
    container_name: yaptide_nginx
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile-nginx
    ports:
      - 5000:5000
      - 8443:8443
    depends_on:
      yaptide_flask:
        condition: service_healthy
      yaptide_simulation_worker:
        condition: service_healthy
      yaptide_helper_worker:
        condition: service_healthy


volumes:
  data:
  simulators:
  garage_meta:
  garage_data:
